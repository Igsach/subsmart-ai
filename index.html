<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubSmart AI | Subscription Manager (India)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800 p-4 md:p-8">

    <div class="max-w-5xl mx-auto" id="pdfContent">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-indigo-600">
                    <i class="fas fa-wallet mr-2"></i> SubSmart AI
                </h1>
                <p class="text-gray-500 text-sm mt-1">Intelligent Subscription & Expense Optimizer</p>
            </div>
            <div class="flex items-center gap-4 w-full md:w-auto">
                <select id="currencyMode" onchange="renderApp()" class="bg-gray-50 border border-gray-200 font-bold text-gray-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-3 shadow-sm cursor-pointer">
                    <option value="INR" selected>₹ INR</option>
                    <option value="USD">$ USD</option>
                </select>
                <button id="pdfBtn" onclick="downloadPDF()" class="w-full md:w-auto bg-white border border-gray-200 hover:bg-gray-100 text-gray-700 font-bold py-3 px-4 rounded-lg shadow-sm transition-transform transform hover:scale-105 flex items-center justify-center">
                    <i class="fas fa-file-pdf text-red-500 mr-2"></i> Download
                </button>
                <button id="aiBtn" onclick="runAIAnalysis()" class="w-full md:w-auto bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition-transform transform hover:scale-105 flex items-center justify-center">
                    <i class="fas fa-magic mr-2"></i> Optimize with AI
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Active Subscriptions List & Add Form -->
            <div class="md:col-span-2 space-y-6">
                
                <!-- Add/Edit Subscription Section -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-indigo-100 bg-indigo-50/30">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-bold text-indigo-700"><i class="fas fa-plus-circle mr-2"></i> <span id="formTitle">Add New Subscription</span></h2>
                        <span id="errorMsg" class="text-xs text-red-500 font-bold hidden">Invalid Name or Price!</span>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="hidden" id="editId" value="">
                        <input type="text" id="newName" placeholder="e.g. WhatsApp, Netflix..." class="flex-1 px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                        <input type="number" id="newPrice" placeholder="Price" class="w-full sm:w-32 px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                        <button id="saveBtn" onclick="saveSubscription()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition-colors">
                            Add
                        </button>
                    </div>
                </div>

                <!-- Subscriptions List -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 text-gray-700"><i class="fas fa-list-check mr-2"></i> Your Active Plans</h2>
                    
                    <div id="subList" class="space-y-4">
                        <!-- Items will be generated here by JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Spending Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center items-center h-fit">
                <h2 class="text-lg font-bold mb-4 text-gray-700 w-full text-left">Monthly Breakdown</h2>
                <div class="w-full max-w-[200px]">
                    <canvas id="expenseChart"></canvas>
                </div>
                <h3 class="mt-4 text-3xl font-black text-indigo-600"><span id="totalDisplay">₹0</span> <span class="text-sm font-normal text-gray-500 block text-center mt-1">/ month avg.</span></h3>
            </div>
        </div>

        <!-- AI Insights Modal -->
        <div id="aiModal" class="hidden mt-6 bg-indigo-50 p-6 rounded-2xl border border-indigo-100 shadow-inner">
            <h3 class="text-lg font-bold text-indigo-800 mb-2"><i class="fas fa-robot mr-2"></i> AI Savings Insight</h3>
            <p class="text-indigo-700 text-sm leading-relaxed" id="aiText">
                <!-- AI Text Generated by JS -->
            </p>
        </div>
    </div>

    <script>
        const exchangeRate = 83; // 1 USD = 83 INR
        
        // Base state always kept in INR for consistency
        let subscriptions = [
            { id: 1, name: 'Spotify Premium', price: 119 },
            { id: 2, name: 'YouTube Premium', price: 129 },
            { id: 3, name: 'Gemini Advanced', price: 1950 }
        ];

        let expenseChart;

        function getAppIcon(appName) {
            const name = appName.toLowerCase();
            const icons = {
                'spotify': 'fab fa-spotify text-green-500',
                'youtube': 'fab fa-youtube text-red-500',
                'gemini': 'fas fa-sparkles text-blue-500',
                'whatsapp': 'fab fa-whatsapp text-green-500',
                'netflix': 'fas fa-play text-red-600',
                'amazon': 'fab fa-amazon text-orange-400',
                'prime': 'fab fa-amazon text-blue-400',
                'apple': 'fab fa-apple text-gray-800',
                'google': 'fab fa-google text-blue-500',
                'microsoft': 'fab fa-windows text-blue-600',
                'adobe': 'fas fa-file-pdf text-red-500',
                'discord': 'fab fa-discord text-indigo-500',
                'slack': 'fab fa-slack text-purple-500',
                'chatgpt': 'fas fa-robot text-green-600',
                'openai': 'fas fa-robot text-green-600',
                'hostinger': 'fas fa-server text-purple-500',
                'linkedin': 'fab fa-linkedin text-blue-700',
                'github': 'fab fa-github text-gray-800',
                'canva': 'fas fa-palette text-cyan-500',
                'zoom': 'fas fa-video text-blue-500',
                'x': 'fab fa-x-twitter text-black',
                'twitter': 'fab fa-x-twitter text-black',
                'instagram': 'fab fa-instagram text-pink-500'
            };

            for (const key in icons) {
                if (name.includes(key)) return icons[key];
            }
            return 'fas fa-star text-yellow-500'; // Default icon
        }

        function renderApp() {
            const listDiv = document.getElementById('subList');
            const currencyMode = document.getElementById('currencyMode').value;
            listDiv.innerHTML = '';
            
            let totalInr = 0;
            let chartLabels = [];
            let chartData = [];
            let chartColors = [];

            subscriptions.forEach(sub => {
                totalInr += sub.price;
                
                // Convert price for display if USD selected
                let displayPrice = sub.price;
                let symbol = '₹';
                if (currencyMode === 'USD') {
                    displayPrice = (sub.price / exchangeRate).toFixed(2);
                    symbol = '$';
                }

                chartLabels.push(sub.name);
                chartData.push(displayPrice);
                
                // Keep colors consistent or random
                chartColors.push('#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0'));

                const iconClass = getAppIcon(sub.name);

                listDiv.innerHTML += `
                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl border border-gray-100 hover:shadow-md transition">
                        <div class="flex items-center gap-4">
                            <i class="${iconClass} text-2xl w-8 text-center"></i>
                            <div><p class="font-bold">${sub.name}</p><p class="text-xs text-gray-500">Monthly</p></div>
                        </div>
                        <div class="flex items-center gap-4">
                            <p class="font-bold text-gray-700 text-lg w-20 text-right">${symbol}${displayPrice}</p>
                            <div class="flex gap-2 border-l border-gray-200 pl-4">
                                <button onclick="editSubscription(${sub.id})" class="text-blue-500 hover:text-blue-700 transition"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteSubscription(${sub.id})" class="text-red-500 hover:text-red-700 transition"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Update Total Display
            let displayTotal = currencyMode === 'USD' ? '$' + (totalInr / exchangeRate).toFixed(2) : '₹' + totalInr;
            document.getElementById('totalDisplay').innerText = displayTotal;

            // Update Chart
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if (expenseChart) {
                expenseChart.destroy(); // Remove old chart to redraw properly
            }
            
            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: chartLabels,
                    datasets: [{ data: chartData, backgroundColor: chartColors, borderWidth: 0 }]
                },
                options: { plugins: { legend: { display: false } }, cutout: '75%' }
            });
        }

        function saveSubscription() {
            const nameInput = document.getElementById('newName').value.trim();
            const priceInput = parseFloat(document.getElementById('newPrice').value);
            const editId = document.getElementById('editId').value;
            const errorMsg = document.getElementById('errorMsg');
            const currencyMode = document.getElementById('currencyMode').value;

            if (!nameInput || isNaN(priceInput) || priceInput <= 0) {
                errorMsg.classList.remove('hidden');
                setTimeout(() => errorMsg.classList.add('hidden'), 2000);
                return;
            }

            // Convert back to INR base if user is adding in USD mode
            let basePriceInr = priceInput;
            if(currencyMode === 'USD') {
                basePriceInr = Math.round(priceInput * exchangeRate);
            }

            if (editId) {
                // Update existing
                const index = subscriptions.findIndex(s => s.id == editId);
                if (index !== -1) {
                    subscriptions[index].name = nameInput;
                    subscriptions[index].price = basePriceInr;
                }
                // Reset form state
                document.getElementById('editId').value = '';
                document.getElementById('saveBtn').innerText = 'Add';
                document.getElementById('formTitle').innerText = 'Add New Subscription';
            } else {
                // Create new
                subscriptions.push({
                    id: Date.now(),
                    name: nameInput,
                    price: basePriceInr
                });
            }

            document.getElementById('newName').value = '';
            document.getElementById('newPrice').value = '';
            renderApp();
        }

        function deleteSubscription(id) {
            subscriptions = subscriptions.filter(s => s.id !== id);
            renderApp();
        }

        function editSubscription(id) {
            const sub = subscriptions.find(s => s.id === id);
            if(sub) {
                document.getElementById('newName').value = sub.name;
                
                // Show price in current currency mode
                const currencyMode = document.getElementById('currencyMode').value;
                document.getElementById('newPrice').value = currencyMode === 'USD' ? (sub.price / exchangeRate).toFixed(2) : sub.price;
                
                document.getElementById('editId').value = sub.id;
                document.getElementById('saveBtn').innerText = 'Update';
                document.getElementById('formTitle').innerText = 'Edit Subscription';
                
                // Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const pdfBtn = document.getElementById('pdfBtn');
            const originalText = pdfBtn.innerHTML;
            
            // Show loading state on button
            pdfBtn.innerHTML = '<i class="fas fa-spinner fa-spin text-red-500 mr-2"></i> Exporting...';
            
            const opt = {
                margin:       0.3,
                filename:     'SubSmart_Expense_Report.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };
            
            // Generate PDF and restore button text
            html2pdf().set(opt).from(element).save().then(() => {
                pdfBtn.innerHTML = originalText;
            });
        }

        function runAIAnalysis() {
            const btn = document.getElementById('aiBtn');
            const currencyMode = document.getElementById('currencyMode').value;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Analyzing...';
            
            setTimeout(() => {
                document.getElementById('aiModal').classList.remove('hidden');
                btn.innerHTML = '<i class="fas fa-check mr-2"></i> Analyzed by AI';
                btn.classList.replace('from-indigo-500', 'from-green-500');
                btn.classList.replace('to-purple-600', 'to-green-600');

                // Dynamic AI Text based on highest expense
                if(subscriptions.length > 0) {
                    let highestSub = subscriptions.reduce((prev, current) => (prev.price > current.price) ? prev : current);
                    let savings = currencyMode === 'USD' ? "$" + ((highestSub.price * 2) / exchangeRate).toFixed(2) : "₹" + (highestSub.price * 2);
                    
                    document.getElementById('aiText').innerHTML = `
                        <strong>Analysis Complete:</strong> You are tracking ${subscriptions.length} plans. <br><br>
                        💡 <strong>AI Recommendation:</strong> Switching your <em>${highestSub.name}</em> from Monthly to Annual billing can save you approximately <strong>${savings} per year</strong>! Consider checking if they offer a family or student discount.
                    `;
                } else {
                    document.getElementById('aiText').innerHTML = "You have no active subscriptions. Add some to get AI insights!";
                }

            }, 1500);
        }

        // Initialize App on load
        window.onload = renderApp;
    </script>
</body>
</html>
